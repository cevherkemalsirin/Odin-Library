<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>library</title>
</head>

<body>
    <h1 class="title">Welcome to library!</h1>
    <div class="container">
        <button command="show-modal" commandfor="addBookDialog" class="addBook">
            +
        </button>
        <dialog id="addBookDialog">
            <form method="dialog" action="#">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages" required>
                <input type="checkbox" id="read" name="read" checked>
                <label for="read">Read</label>
                <button class="FormAddBtn">Add Book</button>
            </form>
        </dialog>
    </div>
</body>

</html>
